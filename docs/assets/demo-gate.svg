<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-label="audio freshness gate rejecting a stale WAV">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .bar { fill: #161b22; }
      .t { font-family: SFMono-Regular, Consolas, Menlo, "Noto Sans JP", monospace; font-size: 15px; fill: #c9d1d9; white-space: pre; }
      .dim { fill: #8b949e; }
      .ok { fill: #3fb950; }
      .ng { fill: #f85149; }
      .warn { fill: #d29922; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="420" rx="10"/>
  <path class="bar" d="M0 10a10 10 0 0 1 10-10h1100a10 10 0 0 1 10 10v30H0z"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text class="t dim" x="560" y="25" text-anchor="middle">audio_freshness.py — stale artifact detected</text>

  <text class="t" x="28" y="86"><tspan class="dim"># 1 script edited, audio NOT regenerated</tspan></text>
  <text class="t" x="28" y="112"><tspan class="dim">$ </tspan>python -m src.pipeline.gates.audio_freshness \</text>
  <text class="t" x="28" y="138">    --scenes samples/scenes.example.json --audio-dir samples/audio</text>

  <text class="t" x="28" y="186">[audio_freshness] total 8 / fresh 7 / <tspan class="ng">stale 1</tspan> / missing 0</text>
  <text class="t ng" x="28" y="212">  [ng] scene 003 zun fingerprint mismatch:</text>
  <text class="t ng" x="76" y="238">この一文だけ差し替えたのだ。</text>

  <text class="t" x="28" y="286"><tspan class="dim">$ </tspan>echo $?</text>
  <text class="t ng" x="28" y="312">1</text>

  <text class="t ok" x="28" y="360">render never starts. the fix is one command:</text>
  <text class="t accent" x="28" y="386">  python -m src.pipeline.orchestrator --unit DEMO-01 --from audio</text>
</svg>
